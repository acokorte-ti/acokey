name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check app tests
      - run: pytest -q

  # Os testes locais usam SQLite; aqui a migração e os mesmos testes rodam no PostgreSQL de produção
  postgres:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: acokeyq
          POSTGRES_USER: acokeyq
          POSTGRES_PASSWORD: somente-ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U acokeyq" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://acokeyq:somente-ci@localhost:5432/acokeyq
      TESTE_DATABASE_URL: postgresql+psycopg://acokeyq:somente-ci@localhost:5432/acokeyq
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Migração sobe, desce e sobe de novo
        run: alembic upgrade head && alembic downgrade base && alembic upgrade head
      - name: Modelos e migração batem
        run: alembic check
      - name: Testes no PostgreSQL
        run: alembic downgrade base && pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
