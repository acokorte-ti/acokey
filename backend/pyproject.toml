[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 140
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]  # Depends() em argumento padrão é o uso normal do FastAPI

[tool.ruff.lint.per-file-ignores]
"tests/test_carga.py" = ["E501"]  # SQL do sistema antigo montado em linha, para ficar legível como o original
