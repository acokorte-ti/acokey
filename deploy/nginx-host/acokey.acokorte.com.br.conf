# Site do AçoKey Q no nginx do servidor (system-lab), no mesmo padrão de estoque/inventario/manutencao.
# A CONFIRMAR: porta local (8093), que precisa estar livre no servidor. Ajuste aqui e no .env.
# Instalação (precisa de sudo): ver README.md, seção "Publicação".
server {
    listen 80;
    server_name acokey.acokorte.com.br;
    location ^~ /.well-known/acme-challenge/ { root /var/www/certbot; default_type "text/plain"; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;   # sintaxe do nginx 1.18 (Ubuntu 22.04)
    server_name acokey.acokorte.com.br;

    ssl_certificate     /etc/letsencrypt/live/acokey.acokorte.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/acokey.acokorte.com.br/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;

    # Somente a rede da empresa (a lista fica no servidor, fora do repositório)
    include /etc/nginx/snippets/ips-empresa.conf;

    add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 30m;   # anexos e certificados (a API limita 25 MB por arquivo)

    location / {
        proxy_pass http://127.0.0.1:8093;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Substitui (não acrescenta): o cliente não consegue forjar o próprio IP.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }
}
