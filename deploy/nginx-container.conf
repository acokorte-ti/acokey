# nginx de dentro do contêiner "web": arquivos do site + encaminhamento de /api para a API.

# Freio nas tentativas de login por IP (além do bloqueio por usuário que a API já faz).
# O IP real chega em X-Real-IP, gravado pelo nginx do servidor.
limit_req_zone $http_x_real_ip zone=login:1m rate=12r/m;
# Freio geral. A empresa sai por poucos IPs públicos, então o limite é do conjunto dos usuários:
# folgado para o uso normal, mas barra um laço disparado por engano ou má-fé.
limit_req_zone $http_x_real_ip zone=api:2m rate=30r/s;
limit_req_status 429;

server {
    listen 80;
    server_tokens off;
    root /usr/share/nginx/html;
    # Fora da API, nada de corpo grande; na API, até 30 MB (anexos, certificados e fotos: a API limita 25 MB por arquivo)
    client_max_body_size 1m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location = /api/auth/login {
        limit_req zone=login burst=8 nodelay;
        include /etc/nginx/seguranca.conf;
        add_header Cache-Control "no-store" always;
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location /api/ {
        client_max_body_size 30m;
        limit_req zone=api burst=60 nodelay;
        include /etc/nginx/seguranca.conf;
        add_header Cache-Control "no-store" always;
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 120s;
    }

    location /assets/ {
        include /etc/nginx/seguranca.conf;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        include /etc/nginx/seguranca.conf;
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
